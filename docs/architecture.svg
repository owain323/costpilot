<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2400" height="1350" fill="#ffffff"/>

  <text x="100" y="95" font-size="50" font-weight="bold" fill="#1a202c">CostPilot</text>
  <text x="100" y="150" font-size="32" fill="#4a5568">The agent only acts on what it can prove</text>

  <rect x="120" y="190" width="2160" height="200" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="1200" y="238" font-size="32" font-weight="bold" fill="#334155" text-anchor="middle">Background pipeline (deterministic)</text>

  <rect x="200" y="270" width="440" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="420" y="315" font-size="30" font-weight="bold" fill="#1d4ed8" text-anchor="middle">FIND</text>
  <text x="420" y="352" font-size="26" fill="#4a5568" text-anchor="middle">scanner.py</text>

  <rect x="720" y="270" width="440" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="940" y="315" font-size="30" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PROVE</text>
  <text x="940" y="352" font-size="26" fill="#4a5568" text-anchor="middle">pricing.py</text>

  <rect x="1240" y="270" width="440" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="1460" y="315" font-size="30" font-weight="bold" fill="#1d4ed8" text-anchor="middle">PATCH</text>
  <text x="1460" y="352" font-size="26" fill="#4a5568" text-anchor="middle">patcher.py</text>

  <rect x="1760" y="270" width="440" height="110" rx="10" fill="#eff6ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="1980" y="315" font-size="30" font-weight="bold" fill="#1d4ed8" text-anchor="middle">VALIDATE</text>
  <text x="1980" y="352" font-size="26" fill="#4a5568" text-anchor="middle">validator.py</text>

  <line x1="648" y1="325" x2="712" y2="325" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1168" y1="325" x2="1232" y2="325" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1688" y1="325" x2="1752" y2="325" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/>

  <line x1="940" y1="390" x2="940" y2="460" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="940" y1="460" x2="1200" y2="460" stroke="#4a5568" stroke-width="2.5"/>
  <line x1="1200" y1="460" x2="1200" y2="512" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="925" y="430" font-size="26" fill="#64748b" text-anchor="end">structured facts only</text>

  <rect x="720" y="520" width="960" height="150" rx="14" fill="#faf5ff" stroke="#a855f7" stroke-width="2.5"/>
  <text x="1200" y="570" font-size="32" font-weight="bold" fill="#7c3aed" text-anchor="middle">Strands Agent (agent_loop.py)</text>
  <text x="1200" y="612" font-size="28" fill="#374151" text-anchor="middle">4 bounded tools: list_candidates &#183; get_candidate &#183; decide &#183; finish</text>
  <text x="1200" y="654" font-size="28" fill="#374151" text-anchor="middle">decides approve / keep / ask_human &#183; never sees raw source</text>

  <line x1="1200" y1="670" x2="1200" y2="732" stroke="#4a5568" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="1230" y="711" font-size="26" fill="#64748b">decisions</text>

  <rect x="650" y="740" width="1100" height="160" rx="14" fill="#fefce8" stroke="#d97706" stroke-width="2.5"/>
  <text x="1200" y="788" font-size="32" font-weight="bold" fill="#b45309" text-anchor="middle">Policy gate (double gate)</text>
  <text x="1200" y="830" font-size="28" fill="#374151" text-anchor="middle">agent approves AND rule allowlist accepts</text>
  <text x="1200" y="874" font-size="28" fill="#374151" text-anchor="middle">git subcommands and flags allowlisted &#183; branch costpilot/* &#183; commit costpilot:</text>

  <line x1="900" y1="900" x2="900" y2="982" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrr)"/>
  <text x="930" y="945" font-size="28" font-weight="bold" fill="#dc2626">block</text>

  <line x1="1500" y1="900" x2="1500" y2="982" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrg)"/>
  <text x="1530" y="945" font-size="28" font-weight="bold" fill="#16a34a">pass</text>

  <rect x="620" y="990" width="560" height="150" rx="14" fill="#fef2f2" stroke="#ef4444" stroke-width="2.5"/>
  <text x="900" y="1040" font-size="30" font-weight="bold" fill="#b91c1c" text-anchor="middle">Kept / handed to human</text>
  <text x="900" y="1082" font-size="28" fill="#374151" text-anchor="middle">unknown pricing &#183; shared definitions</text>
  <text x="900" y="1122" font-size="28" fill="#374151" text-anchor="middle">agent said keep</text>

  <rect x="1220" y="990" width="560" height="150" rx="14" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="1500" y="1040" font-size="30" font-weight="bold" fill="#15803d" text-anchor="middle">Pull request</text>
  <text x="1500" y="1082" font-size="28" fill="#374151" text-anchor="middle">branch costpilot/optimize</text>
  <text x="1500" y="1122" font-size="28" fill="#374151" text-anchor="middle">before/after cost attached</text>

  <line x1="900" y1="1140" x2="900" y2="1190" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="1500" y1="1140" x2="1500" y2="1190" stroke="#64748b" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="700" y="1190" width="1000" height="100" rx="50" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2.5"/>
  <text x="1200" y="1232" font-size="32" font-weight="bold" fill="#334155" text-anchor="middle">Human review</text>
  <text x="1200" y="1272" font-size="28" fill="#4a5568" text-anchor="middle">merge or close the pull request &#183; kept calls ship no change</text>
</svg>
